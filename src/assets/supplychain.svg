<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Supply-chain optimization dashboard illustration">
  <rect width="800" height="500" fill="#0d1526"/>
  <!-- grid rules -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="60" y1="100" x2="740" y2="100"/>
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="260" x2="740" y2="260"/>
